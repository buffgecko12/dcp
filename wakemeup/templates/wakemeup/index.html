{% extends "base.html" %}
{% load staticfiles %}

{% block import %}
    <link href="{% static 'css/buttons.css' %}" rel="stylesheet">
{% endblock %}

<!-- Set page title -->
{% block title %}Wake Me Up - Homepage{% endblock %}

{% block content %}
	<div class="container">
		<br>
		{% if request.user.is_admin %}
	    <div class="row">
    		<a href="{% url 'wakemeup:create_contract' contractid='new' %}" class="btn btn-primary btn-lg btn-huge btn-block">Crear contrato</a>
	    </div>
	    {% endif %}
	    <br>
	    <div class="row">
    		<a href="{% url 'wakemeup:contract_list' %}" class="btn btn-primary btn-lg btn-huge btn-block">Mis contratos</a>
	    </div>
    </div>
{% endblock %}
