{% extends "base.html" %}
{% load static %}

<!-- Set page title -->
{% block title %}Inicio{% endblock %}

{% block content %}
	<div class="container">
		<br>
		{% if request.user.is_admin or request.user.usertype == 'TR' %}
	    <div class="row">
    		<a href="{% url 'wakemeup:create_contract' contractid='new' %}" class="btn btn-primary btn-lg btn-huge btn-block">Crear contrato</a>
	    </div>
	    {% endif %}
	    <br>
	    <div class="row">
    		<a href="{% url 'wakemeup:contract_list' %}" class="btn btn-primary btn-lg btn-huge btn-block">Mis contratos</a>
	    </div>
	    <br>
	    {% if request.user.usertype == 'ST' %}
	    <div class="row">
    		<a href="{% url 'wakemeup:myaccount' %}" class="btn btn-primary btn-lg btn-huge btn-block">Mi cuenta</a>
	    </div>
	    {% endif %}
    </div>
{% endblock %}
