{% extends "base.html" %}
{% load static %}

{% block headimport %}
<style>
	.responsive-iframe-container {
		position: relative; padding-bottom: 75%; height: 0; overflow: hidden;
	}
	 
	.responsive-iframe-container iframe {
		position: absolute; top:0; left: 0; width: 100%; height: 100%;
	}
	
</style>
{% endblock %}

<!-- Set page title -->
{% block title %}Calendario{% endblock %}

{% block content %}
	<div class="container">
		<br>
	    <div class="responsive-iframe-container">
			{% if userprogram.googlecalendarid %}
			<iframe src="https://calendar.google.com/calendar/embed?height=600&amp;wkst=2&amp;bgcolor=%23ffffff&amp;ctz=America%2FBogota&amp;src={{ userprogram.googlecalendarid }}&amp;color=%23B39DDB&amp;showTitle=0&amp;showNav=1&amp;showDate=1&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0&amp;hl=es_419"
					style="border-width:0" width="800" height="600" frameborder="0" scrolling="no">
			</iframe>
			{% else %}
				No hay calendario.
			{% endif %}
	    </div>
    </div>
{% endblock %}
