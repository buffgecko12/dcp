{% extends "base.html" %}
{% load staticfiles %}
{% load render_table from django_tables2 %}

<!-- Set page title -->
{% block title %}Wake Me Up - Contratos{% endblock %}

{% block content %}
	<h4>
		{{ "contrato" | title }}s
		<div class="float-right">
			<a href="{% url 'wakemeup:create_contract' contractid='new' %}">
				<img src="{% static 'img/add-button.png' %}">
			</a>
		</div>
	</h4>
	
	{% render_table contracts %}
{% endblock %}
