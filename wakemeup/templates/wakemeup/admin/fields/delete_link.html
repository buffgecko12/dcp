{% if not record.contractstatus or record.contractstatus == "D" %}
	<form action="{% url 'wakemeup:delete_object' objecttype=objecttype objectid=value %}" method="post">
	    {% csrf_token %}
		<input class="btn btn-sm" name="delete" type="submit" value="Borrar" onclick="return confirm('Estas seguro que desea eliminar este objeto?')";/>
	</form>
{% endif %}
