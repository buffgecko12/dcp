{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
	<div class="container-fluid">
		<br>
	<form method="post" id="teacherForm" data-classes-url="{% url 'wakemeup:ajax_load_classes' %}" novalidate>
		{% crispy form %}
	</form>
	</div>
	

  <script>
    $("#id_schoolid").change(function () {
      var url = $("#teacherForm").attr("data-classes-url");  // get the url of the `load_cities` view
      var schoolId = $(this).val();  // get the selected country ID from the HTML input

      $.ajax({                       // initialize an AJAX request
        url: url,                    // set the url of the request (= localhost:8000/hr/ajax/load-cities/)
        data: {
          'schoolid': schoolId       // add the country id to the GET parameters
        },
        success: function (data) {   // `data` is the return of the `load_cities` view function
          $("#id_currentclasses").html(data);  // replace the contents of the city input with the data that came from the server
        }
      });

    });
  </script>	
	
	
{% endblock %}
