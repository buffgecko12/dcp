{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Descargar archivos{% endblock %}

{% block content %}

	<br>
	{% for file in files %}
		{% ifchanged file.fileclass %}
			<br><b>{{ file.fileclass }}</b><br>
		{% endifchanged %}
		
		<a href="{% url 'wakemeup:download_file' file.fileid %}">
			<img height="24" src="{{file.fileattributes.gd.iconLink}}"/>
			{{file.filename|truncatechars:30}}
		</a><br>
	{% endfor %}
{% endblock %}
