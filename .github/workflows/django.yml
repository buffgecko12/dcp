name: Django CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      env:
        DATABASE_URL = ${{ secrets.DATABASE_URL_HEROKU_TST }}
      run: |
        python manage.py test test.test_authorization.py
        python manage.py test test.test_class.py
        python manage.py test test.test_contract.py
        python manage.py test test.test_environment.py
        python manage.py test test.test_googlecalendar.py
        python manage.py test test.test_googledrive.py
        python manage.py test test.test_program.py
        python manage.py test test.test_reward.py
        python manage.py test test.test_school.py
        python manage.py test test.test_teacher.py
        python manage.py test test.test_tz.py
        python manage.py test test.test_user_reputation.py
        python manage.py test test.test_user.py
