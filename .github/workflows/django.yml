name: Django CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4
    - name: Set env
      run: | 
        echo "DATABASE_URL=${{ secrets.DATABASE_URL_HEROKU_TST }}" >> $GITHUB_ENV
        echo "PYTHONPATH=$GITHUB_WORKSPACE/test/:$GITHUB_WORKSPACE/lib/" >> $GITHUB_ENV
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        echo "$PYTHONPATH"
        python manage.py test test.test_authorization
        python manage.py test test.test_class
        python manage.py test test.test_contract
        python manage.py test test.test_environment
        python manage.py test test.test_googlecalendar
        python manage.py test test.test_googledrive
        python manage.py test test.test_program
        python manage.py test test.test_reward
        python manage.py test test.test_school
        python manage.py test test.test_teacher
        python manage.py test test.test_tz
        python manage.py test test.test_user_reputation
        python manage.py test test.test_user
